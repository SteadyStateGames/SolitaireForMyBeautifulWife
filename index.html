// Mobile browser bars and rotation can change the visible height without a
// window resize. The shell owns the canvas CSS size and physical buffer;
// policy 0 makes Godot observe that buffer without forcing window.innerHeight.
(function () {
  function syncViewport() {
    const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--game-height', `${Math.floor(height)}px`);
    const canvas = document.getElementById('canvas');
    const scale = window.devicePixelRatio || 1;
    const width = Math.max(1, Math.floor(canvas.clientWidth * scale));
    const bufferHeight = Math.max(1, Math.floor(canvas.clientHeight * scale));
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== bufferHeight) canvas.height = bufferHeight;
  }
  new ResizeObserver(syncViewport).observe(document.body);
  syncViewport();
  window.addEventListener('resize', syncViewport);
  window.addEventListener('orientationchange', syncViewport);
  document.addEventListener('fullscreenchange', syncViewport);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', syncViewport);
}());
</script>
